<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="whiteHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#whiteHalo)">
    <!-- Thick High-Contrast White Background Silhouette -->
    <!-- Blade White Backing -->
    <path d="M 4 4 L 18 10 L 14 14 L 10 18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Guard & Handle White Backing -->
    <line x1="12" y1="20" x2="20" y2="12" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="16" x2="31" y2="31" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />

    <!-- 1. Handle (Tsuka) -->
    <line x1="16" y1="16" x2="31" y2="31" stroke="#1E1E24" stroke-width="4" stroke-linecap="round" />
    <!-- Handle Wrappings (Ito diamonds) -->
    <circle cx="20" cy="20" r="1.5" fill="#EF4444" />
    <circle cx="24" cy="24" r="1.5" fill="#F59E0B" />
    <circle cx="28" cy="28" r="1.5" fill="#EF4444" />

    <!-- 2. Guard (Tsuba) -->
    <line x1="12" y1="20" x2="20" y2="12" stroke="#1E1E24" stroke-width="3.5" stroke-linecap="round" />
    <line x1="12.5" y1="19.5" x2="19.5" y2="12.5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- 3. Blade (Katana) -->
    <path d="M 4 4 Q 13 8 18 11 L 14 15 Q 9 12 4 4 Z" fill="url(#bladeGrad)" stroke="#1E1E24" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Sharp Cutting Edge Highlight -->
    <path d="M 4 4 Q 12 7.5 17 10.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />

    <!-- 4. Shiny Star Sparkle at the Tip -->
    <polygon points="4,1 5,3 7,4 5,5 4,7 3,5 1,4 3,3" fill="#FFFFFF" stroke="#1E1E24" stroke-width="0.8" />
  </g>
</svg>

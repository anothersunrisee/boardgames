<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="bladeGradSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FF5A26" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Slashing Flare Ring / Energy Arc -->
    <path d="M 1 12 C 1 4 8 1 14 1 C 8 4 4 8 4 14 Z" fill="url(#slashGrad)" opacity="0.9" />
    <path d="M 2 10 Q 5 2 12 2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Thick High-Contrast White Background Silhouette -->
    <path d="M 4 4 L 18 10 L 14 14 L 10 18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    <line x1="12" y1="20" x2="20" y2="12" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
    <line x1="16" y1="16" x2="31" y2="31" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />

    <!-- Handle -->
    <line x1="16" y1="16" x2="31" y2="31" stroke="#1E1E24" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="21" cy="21" r="1.6" fill="#F59E0B" />
    <circle cx="26" cy="26" r="1.6" fill="#FF5A26" />

    <!-- Guard -->
    <line x1="12" y1="20" x2="20" y2="12" stroke="#1E1E24" stroke-width="4" stroke-linecap="round" />
    <line x1="12.5" y1="19.5" x2="19.5" y2="12.5" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />

    <!-- Blade -->
    <path d="M 4 4 Q 13 8 18 11 L 14 15 Q 9 12 4 4 Z" fill="url(#bladeGradSlash)" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round" />
    <path d="M 4 4 Q 12 7.5 17 10.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />

    <!-- Slashing Energy Sparks -->
    <circle cx="3" cy="3" r="2.5" fill="#FFFFFF" stroke="#FF5A26" stroke-width="1" />
    <circle cx="9" cy="2" r="1.5" fill="#FDE047" />
    <circle cx="2" cy="9" r="1.5" fill="#FDE047" />
    <polygon points="4,0 6,3 9,4 6,5 4,8 3,5 0,4 3,3" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.5" flood-color="#1E1E24" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with tactile border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="#1E1E24" stroke-width="3.5" />

  <!-- Inner Soft Highlight -->
  <rect x="6" y="6" width="52" height="26" rx="13" fill="#FFFFFF" opacity="0.18" />

  <!-- Playful Game Bot Face / Mascot -->
  <g filter="url(#shadow)">
    <!-- Mini Crown on Top -->
    <path d="M 24 15 L 21 21 L 43 21 L 40 15 L 35 18 L 32 13 L 29 18 Z" fill="url(#crownGrad)" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round" />
    <circle cx="32" cy="13" r="1.5" fill="#EF4444" />
    <circle cx="24" cy="15" r="1.2" fill="#3B82F6" />
    <circle cx="40" cy="15" r="1.2" fill="#10B981" />

    <!-- Cute Eyes -->
    <ellipse cx="24" cy="31" rx="4" ry="5.5" fill="#1E1E24" />
    <circle cx="22.5" cy="29.5" r="1.8" fill="#FFFFFF" />

    <ellipse cx="40" cy="31" rx="4" ry="5.5" fill="#1E1E24" />
    <circle cx="38.5" cy="29.5" r="1.8" fill="#FFFFFF" />

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="17.5" cy="36" rx="3.5" ry="2" fill="#EF4444" opacity="0.45" />
    <ellipse cx="46.5" cy="36" rx="3.5" ry="2" fill="#EF4444" opacity="0.45" />

    <!-- Big Happy Smile -->
    <path d="M 26 38 Q 32 46 38 38" fill="#FFFFFF" stroke="#1E1E24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 27 38 Q 32 44 37 38 Z" fill="#DC2626" />
  </g>

  <!-- Mini Sparkling Star in corner -->
  <path d="M 50 11 Q 50 14 53 14 Q 50 14 50 17 Q 50 14 47 14 Q 50 14 50 11 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
